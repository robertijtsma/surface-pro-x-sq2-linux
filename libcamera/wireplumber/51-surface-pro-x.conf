monitor.alsa.rules = [
  {
    matches = [ { node.name = "alsa_output.platform-sound.HiFi__Speaker__sink" } ]
    actions = { update-props = { audio.format = "S16LE", audio.rate = 48000 } }
  }
  {
    matches = [ { node.name = "~alsa_input.platform-sound.*" } ]
    actions = { update-props = { audio.format = "S16LE", audio.rate = 48000 } }
  }
]
