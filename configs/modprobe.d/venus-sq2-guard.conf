# Prevent systemd-udevd early coldplug from probing VIDEOCC (MMCX) or Venus
# before SPMI, RPMh, remoteproc, and display have settled (same MMCX/MM0
# watchdog rule as blacklist-camera.conf for camcc_sc8180x).
blacklist videocc_sm8150
blacklist venus_core
blacklist venus_dec
blacklist venus_enc
options venus_core sq2_platform_allow=0
