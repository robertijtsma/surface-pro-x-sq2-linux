[Unit]
After=qrtr-ns.service

[Service]
# Work around Linux 7.3 QRTR announcement race ("failed to announce new service" / -EAGAIN in qrtr_node_enqueue):
# 1. Unload duplicate in-kernel qcom_pd_mapper so Node 1 srv_table starts clean during modem boot.
# 2. Start remoteproc modem 0.7s BEFORE rmtfs/pd-mapper/tqftpserv bind their QRTR sockets so
#    qrtr_hello_work marks node->hello_sent = true first, allowing ath10k/wlan0 to come up on first attempt.
ExecStartPre=/bin/sh -c 'rmmod qcom_pd_mapper 2>/dev/null || true; for r in /sys/class/remoteproc/remoteproc*; do if [ "$(cat "$r/name" 2>/dev/null)" = "modem" ]; then [ "$(cat "$r/state" 2>/dev/null)" = "running" ] && echo stop > "$r/state" 2>/dev/null && sleep 0.3; echo start > "$r/state" 2>/dev/null || true; sleep 0.7; fi; done'
