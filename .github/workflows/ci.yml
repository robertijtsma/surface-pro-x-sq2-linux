name: Validate Patches, Drivers & User-Space Stack

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    name: Syntax, Build & No-Blob Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify zero binary blobs or personal identifiers
        run: |
          ! find . -path './.git' -prune -o -type f \( -name '*.ko' -o -name '*.so' -o -name '*.mbn' -o -name '*.bin' -o -name '*.dtb' \) -print | grep -q .

      - name: Validate all 14 kernel patches (git apply --stat)
        run: |
          for p in patches/*.patch; do
            echo "Checking patch header & diff structure: $p"
            git apply --stat "$p"
          done

      - name: Validate user-space scripts & compile Mutter #5215 tablet guard
        run: |
          chmod +x scripts/install-sq2-userspace.sh scripts/surface-sq2-diag.sh
          ./scripts/install-sq2-userspace.sh --check
          bash -n packaging/arch/PKGBUILD

      - name: Compile Howdy Face ID single-thread PAM wrappers
        run: |
          gcc -O2 -Wall -Wextra -o /tmp/howdy-compare-wrapper faceid/howdy_compare_wrapper.c
          gcc -O2 -Wall -Wextra -o /tmp/howdy-cli-wrapper faceid/howdy_cli_wrapper.c
          rm -f /tmp/howdy-compare-wrapper /tmp/howdy-cli-wrapper
