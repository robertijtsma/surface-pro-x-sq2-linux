<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="100%" role="img" aria-label="Surface Pro X SQ2 Linux 7.3 ARM64 Enablement">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="50%" stop-color="#111a33"/>
      <stop offset="100%" stop-color="#0d1b2a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.04"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="280" rx="18" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="1197" height="277" rx="16.5" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- Subtle architectural grid -->
  <g stroke="#1e293b" stroke-opacity="0.45" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70"/>
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="200" y1="0" x2="200" y2="280"/>
    <line x1="400" y1="0" x2="400" y2="280"/>
    <line x1="600" y1="0" x2="600" y2="280"/>
    <line x1="800" y1="0" x2="800" y2="280"/>
    <line x1="1000" y1="0" x2="1000" y2="280"/>
  </g>

  <!-- Ambient glow orb -->
  <circle cx="1020" cy="140" r="140" fill="url(#glow)"/>

  <!-- Top Accent Bar -->
  <rect x="48" y="38" width="110" height="4" rx="2" fill="url(#accent)"/>

  <!-- Title & Subtitle -->
  <text x="48" y="96" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="40" font-weight="800" fill="#f8fafc" letter-spacing="-0.8">
    Surface Pro X SQ2 · Linux 7.3 ARM64
  </text>
  <text x="48" y="134" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#94a3b8">
    Complete Qualcomm SC8180X Hardware Enablement · 14 Kernel Patches · 7 DKMS Modules · Verified Live on EL1
  </text>

  <!-- Feature Pills Row 1 -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="600">
    <rect x="48" y="164" width="182" height="32" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.5"/>
    <text x="139" y="185" text-anchor="middle" fill="#38bdf8">3 Cameras + IR Face ID</text>

    <rect x="242" y="164" width="218" height="32" rx="8" fill="#0f172a" stroke="#818cf8" stroke-opacity="0.5"/>
    <text x="351" y="185" text-anchor="middle" fill="#a5b4fc">Slim Pen 2 Haptics (0x0E)</text>

    <rect x="472" y="164" width="166" height="32" rx="8" fill="#0f172a" stroke="#34d399" stroke-opacity="0.5"/>
    <text x="555" y="185" text-anchor="middle" fill="#34d399">4G LTE (IPA v4.1)</text>

    <rect x="650" y="164" width="162" height="32" rx="8" fill="#0f172a" stroke="#f472b6" stroke-opacity="0.5"/>
    <text x="731" y="185" text-anchor="middle" fill="#f472b6">Venus 4K Decode</text>

    <rect x="824" y="164" width="144" height="32" rx="8" fill="#0f172a" stroke="#fbbf24" stroke-opacity="0.5"/>
    <text x="896" y="185" text-anchor="middle" fill="#fbbf24">s2idle + RPMh</text>
  </g>

  <!-- Feature Pills Row 2 -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="500" fill="#cbd5e1">
    <rect x="48" y="208" width="142" height="30" rx="8" fill="#1e293b" fill-opacity="0.7"/>
    <text x="119" y="228" text-anchor="middle">Adreno 685 GPU</text>

    <rect x="202" y="208" width="150" height="30" rx="8" fill="#1e293b" fill-opacity="0.7"/>
    <text x="277" y="228" text-anchor="middle">2x USB-C DP Alt</text>

    <rect x="364" y="208" width="144" height="30" rx="8" fill="#1e293b" fill-opacity="0.7"/>
    <text x="436" y="228" text-anchor="middle">QSEE fTPM 2.0</text>

    <rect x="520" y="208" width="160" height="30" rx="8" fill="#1e293b" fill-opacity="0.7"/>
    <text x="600" y="228" text-anchor="middle">WCD934x SoundWire</text>

    <rect x="692" y="208" width="162" height="30" rx="8" fill="#1e293b" fill-opacity="0.7"/>
    <text x="773" y="228" text-anchor="middle">SLPI IMU &amp; TCS3430</text>
  </g>

  <!-- Right-side 15/15 Status Ring -->
  <g transform="translate(1075, 140)">
    <circle r="66" fill="#0f172a" stroke="#1e293b" stroke-width="6"/>
    <circle r="66" fill="none" stroke="url(#accent)" stroke-width="6" stroke-dasharray="415" stroke-dashoffset="0" stroke-linecap="round"/>
    <text x="0" y="-4" text-anchor="middle" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="30" font-weight="800" fill="#f8fafc">15/15</text>
    <text x="0" y="18" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" fill="#34d399" letter-spacing="1">VERIFIED</text>
    <text x="0" y="34" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#94a3b8">SC8180X</text>
  </g>
</svg>
